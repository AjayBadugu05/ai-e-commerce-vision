<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Light & Dark Specular Rims -->
    <linearGradient id="neu-rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d97745" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#08090d" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Metallic Specular Core Gradient -->
    <linearGradient id="brand-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#d97745"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="neu-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Base Plate -->
  <rect width="100" height="100" rx="28" fill="#111318"/>

  <!-- Extruded Neumorphic Disc -->
  <circle cx="50" cy="50" r="38" fill="#161922" filter="url(#neu-glow)" stroke="url(#neu-rim-light)" stroke-width="1.5"/>

  <!-- Inset Concentric Ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#252a36" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Core Branding Monogram: Æ -->
  <text x="50" y="59" font-family="'Syne', 'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="900" fill="url(#brand-gold)" text-anchor="middle" letter-spacing="-1">Æ</text>
</svg>
