<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neumorphic Drop Shadow Filters -->
    <filter id="neu-dark" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="14" dy="14" stdDeviation="12" flood-color="#cfc8bb" flood-opacity="0.8"/>
    </filter>
    <filter id="neu-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#b13d17" flood-opacity="0.45"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6f0"/>
      <stop offset="100%" stop-color="#e6e1d5"/>
    </linearGradient>

    <linearGradient id="symbol-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b13d17"/>
      <stop offset="50%" stop-color="#d97745"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Outer Neumorphic Card Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" filter="url(#neu-dark)"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9"/>

  <!-- Inner Recessed Ring -->
  <circle cx="256" cy="256" r="160" fill="url(#bg-grad)" stroke="#d4cdc1" stroke-width="3"/>

  <!-- Stylized Monogram A Emblem -->
  <path d="M256 128 L348 336 H300 L278 284 H234 L212 336 H164 L256 128 Z M256 200 L244 244 H268 L256 200 Z" 
        fill="url(#symbol-grad)" filter="url(#neu-glow)"/>

  <!-- Luminous Focal Dot -->
  <circle cx="256" cy="116" r="14" fill="#b13d17"/>
</svg>
